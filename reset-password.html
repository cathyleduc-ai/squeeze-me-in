
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Squeeze Me In</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #EAF9F8;
      color: #1F2937;
    }
    header {
      background: white;
      text-align: center;
      padding: 24px 12px;
      border-bottom: 4px solid #00B3B8;
    }
    header h1 { color: #00B3B8; margin: 0; }
    main { max-width: 480px; margin: 45px auto; padding: 18px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #FF7A00;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #00B3B8; }
    .hidden { display: none; }
    #message { line-height: 1.5; }
  </style>
</head>
<body>
  <header><h1>Squeeze Me In</h1></header>

  <main>
    <div class="card">
      <h2>Reset Your Password</h2>

      <p id="message" role="status"></p>

      <form id="requestForm">
        <p>Enter your business email to receive a reset link.</p>
        <input id="email" type="email"
               placeholder="Business email" required>
        <button type="submit">Send Reset Link</button>
      </form>

      <form id="newPasswordForm" class="hidden">
        <p>Enter your new password.</p>
        <input id="newPassword" type="password"
               placeholder="New password"
               minlength="8" autocomplete="new-password" required>
        <input id="confirmPassword" type="password"
               placeholder="Confirm password"
               minlength="8" autocomplete="new-password" required>
        <button type="submit">Save New Password</button>
      </form>

      <p><a href="/business-dashboard.html">Back to Business Login</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://zhgieqcdirxywwbyprlo.supabase.co",
      "sb_publishable_brnqWUHE-F7TUx-6OcLgzw_Mk-aFOFy",
      {
        auth: {
          detectSessionInUrl: true,
          flowType: "implicit"
        }
      }
    );

    const message = document.getElementById("message");
    const requestForm = document.getElementById("requestForm");
    const newPasswordForm =
      document.getElementById("newPasswordForm");

    function showNewPasswordForm() {
      requestForm.classList.add("hidden");
      newPasswordForm.classList.remove("hidden");
      message.textContent = "Enter your new password below.";
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        showNewPasswordForm();
      }
    });

    const hashParams = new URLSearchParams(
      window.location.hash.substring(1)
    );

    if (hashParams.get("type") === "recovery") {
      showNewPasswordForm();
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      message.textContent = "Sending reset email...";

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo:
            "https://www.squeezemein.ca/reset-password.html"
        });

      message.textContent = error
        ? "Unable to send reset email: " + error.message
        : "If this email has an account, a password-reset link will be sent. Check your inbox and spam folder.";
    });

    newPasswordForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("newPassword").value;
      const confirm =
        document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      const { data: sessionData } =
        await supabaseClient.auth.getSession();

      if (!sessionData.session) {
        message.textContent =
          "Your reset link has expired or is invalid. Request a new link.";
        return;
      }

      const { error } =
        await supabaseClient.auth.updateUser({ password });

      if (error) {
        message.textContent = "Error: " + error.message;
        return;
      }

      newPasswordForm.classList.add("hidden");
      message.textContent =
        "Password updated successfully! You can now sign in.";

      await supabaseClient.auth.signOut();
      window.history.replaceState(
        null, "",
        window.location.pathname
      );
    });
  </script>
</body>
</html>
